<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="50%" stop-color="#e29532" />
      <stop offset="100%" stop-color="#b86918" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="94" fill="#141414" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- Crossed scissors symbol -->
  <g transform="translate(100, 95)" stroke="url(#goldGrad)" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Blade -->
    <path d="M-32,38 C-25,38 -20,32 -20,25 C-20,18 -26,14 -32,18 L0,-18 L-8,-38 L0,-18" />
    <!-- Left loop -->
    <circle cx="-32" cy="27" r="11" />
    
    <!-- Right Blade -->
    <path d="M32,38 C25,38 20,32 20,25 C20,18 26,14 32,18 L0,-18 L8,-38 L0,-18" />
    <!-- Right loop -->
    <circle cx="32" cy="27" r="11" />

    <!-- Center pivot screw -->
    <circle cx="0" cy="-18" r="3.5" fill="url(#goldGrad)" />
  </g>

  <!-- Straight Razor or Barber Pole Accents -->
  <path d="M72,130 Q100,122 128,130" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" />
  <polygon points="100,123 96,128 104,128" fill="url(#goldGrad)" />

  <!-- Stars -->
  <polygon points="40,98 42,92 46,95 44,101 39,99" fill="url(#goldGrad)" transform="scale(0.8) translate(15, 20)" />
  <polygon points="160,98 158,92 154,95 156,101 161,99" fill="url(#goldGrad)" transform="scale(0.8) translate(35, 20)" />

  <!-- Arc Text Top & Bottom -->
  <path id="textArcTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
  <path id="textArcBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />

  <text font-family="'Outfit', 'Cinzel', serif" font-size="11.5" font-weight="800" fill="url(#goldGrad)" letter-spacing="2" text-anchor="middle">
    <textPath href="#textArcTop" startOffset="50%">SALON HÀ MINH</textPath>
  </text>

  <text font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#e29532" letter-spacing="3" text-anchor="middle">
    <textPath href="#textArcBottom" startOffset="50%">SINCE 2018</textPath>
  </text>
</svg>
